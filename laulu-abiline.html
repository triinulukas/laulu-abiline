<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lauluabiline">
<title>Lauluabiline</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@2.3.1/build/opensheetmusicdisplay.min.js"></script>
<style>
  :root{--bg:#FAF6EF;--card:#fff;--ink:#1E2230;--muted:#6B7080;--line:#E6E0D6;--accent:#2F5BEA;--good:#1F9D55;--near:#E0A100;--off:#E4572E}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0 6px 0 0}
  button,.filebtn,select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:999px;cursor:pointer;-webkit-user-select:none;user-select:none}
  select{padding:8px 10px;max-width:170px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary.on{background:var(--off);border-color:var(--off)}
  button:disabled{opacity:.45}
  .filebtn input{display:none}
  .tempo{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .tempo input{width:90px}
  #msg{display:none;margin:10px 12px 0;padding:10px 14px;border-radius:12px;background:#FFF1EC;border:1px solid #F4C3B4;color:#8A2E14;font-size:14px}
  #scoreWrap{margin:12px;padding:6px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:50vh;margin-bottom:190px}
  #empty{min-height:48vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:8px;padding:20px}
  #empty b{color:var(--ink);font-size:17px}
  #dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.05)}
  #row1{display:flex;align-items:center;gap:14px}
  .box{flex:1;text-align:center;border-radius:14px;padding:6px 4px;background:#F4F1EA}
  .box small{display:block;font-size:12px;color:var(--muted)}
  .box span{font-size:38px;font-weight:800;line-height:1.1}
  #sungBox span{transition:color .1s}
  #feedback{text-align:center;font-weight:700;font-size:17px;margin:6px 0 4px;min-height:22px}
  .meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--off) 0 25%,var(--near) 25% 38%,var(--good) 38% 62%,var(--near) 62% 75%,var(--off) 75%)}
  .meter i{position:absolute;top:-4px;width:4px;height:18px;background:var(--ink);border-radius:2px;left:50%;transform:translateX(-2px);transition:left .08s}
  #row3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  #row3 button{padding:7px 12px;font-size:14px}
  #progress{font-size:14px;color:var(--muted);text-align:center;flex:1}
  #summary{display:none;position:fixed;inset:0;z-index:20;background:rgba(30,34,48,.45);align-items:center;justify-content:center;padding:20px}
  #summary .card{background:#fff;border-radius:20px;padding:24px;max-width:360px;text-align:center}
  #summary .big{font-size:48px;font-weight:800;margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>Lauluabiline</h1>
  <label class="filebtn">Ava noot<input id="file" type="file" accept=".mxl,.musicxml,.xml,application/vnd.recordare.musicxml,application/vnd.recordare.musicxml+xml,text/xml"></label>
  <select id="voiceSel" disabled><option>Hääl</option></select>
  <button id="micBtn" class="primary" disabled>Laula</button>
  <button id="playBtn" disabled>Mängi ette</button>
  <button id="restartBtn" disabled>Algusest</button>
  <label class="tempo">Tempo <input id="tempo" type="range" min="40" max="160" value="90"><span id="tempoVal">90</span></label>
</header>
<div id="msg"></div>
<div id="scoreWrap">
  <div id="empty"><b>Ava laulu noodifail</b><div>MusicXML-fail (.mxl või .musicxml), näiteks MuseScore'ist eksporditud.</div></div>
  <div id="score"></div>
</div>
<div id="dock">
  <div id="row1">
    <div class="box" id="targetBox"><small>Noodis</small><span id="targetNote">–</span></div>
    <div class="box" id="sungBox"><small>Sina laulad</small><span id="sungNote">–</span></div>
  </div>
  <div id="feedback"></div>
  <div class="meter"><i id="needle"></i></div>
  <div id="row3">
    <button id="prevBtn" disabled>◀</button>
    <button id="giveBtn" disabled>Anna noot</button>
    <div id="progress"></div>
    <button id="nextBtn" disabled>▶</button>
  </div>
</div>
<div id="summary"><div class="card"><div>Laul läbi!</div><div class="big" id="sumPct"></div><div id="sumText"></div><br><button class="primary" id="sumAgain">Proovi uuesti</button></div></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const NAMES=["C","Cis","D","Dis","E","F","Fis","G","Gis","A","B","H"];
const SUP={3:"",4:"¹",5:"²",6:"³",2:""};
const COL={good:"#1F9D55",fixed:"#7BB662",bad:"#E4572E",cur:"#2F5BEA"};
function noteLabel(m){const r=Math.round(m);const o=Math.floor(r/12)-1;return NAMES[((r%12)+12)%12]+(SUP[o]!==undefined?SUP[o]:"");}
function showMsg(t){$("msg").textContent=t||"";$("msg").style.display=t?"block":"none";}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* ---------- audio ---------- */
let ctx=null;
function ac(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();}if(ctx.state==="suspended")ctx.resume();return ctx;}
function tone(midi,start,dur){
  const c=ac(),t=start||c.currentTime,f=440*Math.pow(2,(midi-69)/12),len=Math.max(0.25,dur||1);
  const out=c.createGain();out.gain.setValueAtTime(0.0001,t);out.gain.exponentialRampToValueAtTime(0.32,t+0.01);
  out.gain.exponentialRampToValueAtTime(0.12,t+Math.min(0.4,len*0.6));out.gain.exponentialRampToValueAtTime(0.0001,t+len+0.25);
  out.connect(c.destination);
  [[1,1,"triangle"],[2,0.4,"sine"],[3,0.15,"sine"]].forEach(([h,a,ty])=>{const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f*h;g.gain.value=a;o.connect(g);g.connect(out);o.start(t);o.stop(t+len+0.3);});
}

/* ---------- pitch (McLeod) ---------- */
function detect(buf,sr){
  const n=buf.length;let rms=0;for(let i=0;i<n;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/n);
  if(rms<0.012)return {f:null,rms};
  const minLag=Math.floor(sr/1100),maxLag=Math.min(Math.floor(sr/75),n-1),ns=new Float32Array(maxLag+1);
  for(let tau=1;tau<=maxLag;tau++){let a=0,m=0;for(let i=0;i<n-tau;i++){const x=buf[i],y=buf[i+tau];a+=x*y;m+=x*x+y*y;}ns[tau]=m>0?2*a/m:0;}
  const peaks=[];let pos=false,best=-1,bt=0;
  for(let t=2;t<maxLag;t++){
    if(ns[t-1]<=0&&ns[t]>0){pos=true;best=-1;}
    else if(ns[t-1]>0&&ns[t]<=0&&pos){if(best>0&&bt>=minLag)peaks.push(bt);pos=false;}
    if(pos&&ns[t]>best){best=ns[t];bt=t;}
  }
  if(!peaks.length)return {f:null,rms};
  let mx=0;peaks.forEach(t=>{if(ns[t]>mx)mx=ns[t];});if(mx<0.8)return {f:null,rms};
  const T=peaks.find(t=>ns[t]>=0.9*mx),a=ns[T-1],b=ns[T],c=ns[T+1],d=a-2*b+c,sh=d?0.5*(a-c)/d:0,f=sr/(T+sh);
  return {f:(f>=75&&f<=1100)?f:null,rms};
}

/* ---------- score ---------- */
let osmd=null,xmlText=null,targets=[],status=[],idx=0,voiceOpts=[],curOpt=0;
function osmdInit(){
  if(!window.opensheetmusicdisplay){showMsg("Noodilugeja ei laadinud. Kontrolli internetiühendust ja laadi leht uuesti.");return null;}
  const o=new opensheetmusicdisplay.OpenSheetMusicDisplay("score",{autoResize:false,backend:"svg",drawTitle:true,drawPartNames:false,followCursor:true,cursorsOptions:[{type:0,color:"#2F5BEA",alpha:0.35,follow:true}]});
  return o;
}
async function readFile(file){
  const buf=await file.arrayBuffer();const u8=new Uint8Array(buf);
  if(u8[0]===0x50&&u8[1]===0x4B){
    if(!window.JSZip)throw new Error("zip");
    const zip=await JSZip.loadAsync(buf);let path=null;
    const cont=zip.file("META-INF/container.xml");
    if(cont){const cx=new DOMParser().parseFromString(await cont.async("string"),"application/xml");const rf=cx.querySelector("rootfile");if(rf)path=rf.getAttribute("full-path");}
    if(!path){const f=Object.keys(zip.files).find(n=>/\.(xml|musicxml)$/i.test(n)&&!n.startsWith("META-INF"));path=f;}
    return await zip.file(path).async("string");
  }
  return new TextDecoder().decode(u8);
}
$("file").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(/\.pdf$/i.test(f.name)){showMsg("See on PDF. Lauluabiline vajab MusicXML-faili (.mxl või .musicxml).");return;}
  try{const x=await readFile(f);store("la_xml",x);store("la_opt","0");await openScore(x,0);}
  catch(err){showMsg("Faili avamine ebaõnnestus. Kas see on MusicXML-fail (.mxl / .musicxml)?");}
});
async function openScore(x,opt){
  showMsg("");xmlText=x;
  if(!osmd)osmd=osmdInit();if(!osmd)return;
  await osmd.load(x);
  $("empty").style.display="none";
  // voice options
  voiceOpts=[];
  osmd.Sheet.Instruments.forEach((ins,i)=>{
    const names=(ins.Name||"Partii "+(i+1)).split(/\n|\r|\//).map(s=>s.trim()).filter(Boolean);
    const vs=ins.Voices.map(v=>v.VoiceId);
    vs.forEach((vid,j)=>{
      let label=vs.length===1?names.join(" "):(names.length===vs.length?names[j]:(names.join(" ")+" – hääl "+(j+1)));
      label=label.replace(/^S\.?$/,"Sopran").replace(/^A\.?$/,"Alt").replace(/^T\.?$/,"Tenor").replace(/^B\.?$/,"Bass");
      voiceOpts.push({ins:i,vid,label});
    });
  });
  const sel=$("voiceSel");sel.innerHTML="";
  voiceOpts.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.label;sel.appendChild(o);});
  curOpt=Math.min(opt||0,voiceOpts.length-1);sel.value=curOpt;sel.disabled=false;
  setupVoice();
}
$("voiceSel").addEventListener("change",e=>{curOpt=+e.target.value;store("la_opt",String(curOpt));setupVoice();});

function render(){
  const w=$("scoreWrap").clientWidth;osmd.zoom=w<600?0.62:w<900?0.8:1.0;
  osmd.render();osmd.cursor.show();
}
function setupVoice(){
  stopPlay();
  const v=voiceOpts[curOpt];
  osmd.Sheet.Instruments.forEach((ins,i)=>{ins.Visible=(i===v.ins);});
  render();
  // collect targets by walking the cursor
  targets=[];const c=osmd.cursor;c.reset();let step=0;
  while(!c.Iterator.EndReached){
    const ns=c.NotesUnderCursor().filter(n=>!n.isRest()&&n.ParentVoiceEntry&&n.ParentVoiceEntry.ParentVoice.VoiceId===v.vid);
    const fresh=ns.filter(n=>!(n.NoteTie&&n.NoteTie.StartNote!==n));
    if(fresh.length){
      fresh.sort((a,b)=>b.halfTone-a.halfTone);const n=fresh[0];
      let len=n.Length.RealValue;if(n.NoteTie&&n.NoteTie.Notes)len=n.NoteTie.Notes.reduce((s,x)=>s+x.Length.RealValue,0);
      const also=c.NotesUnderCursor().filter(x=>x!==n&&!x.isRest()&&x.halfTone===n.halfTone);
      targets.push({step,midi:n.halfTone+12,len,ts:c.Iterator.currentTimeStamp.RealValue,note:n,also});
    }
    c.Iterator.moveToNext();step++;
  }
  status=targets.map(()=>null);
  ["micBtn","playBtn","restartBtn","prevBtn","nextBtn","giveBtn"].forEach(id=>$(id).disabled=!targets.length);
  if(!targets.length)showMsg("Selles hääles ei leidnud noote. Vali teine hääl.");
  goTo(0);
}
function goTo(i){
  idx=Math.max(0,Math.min(i,targets.length));held=0;active=false;wrongMs=0;wrongNote=null;onset=false;
  const c=osmd.cursor;c.reset();
  const step=idx<targets.length?targets[idx].step:(targets.length?targets[targets.length-1].step:0);
  for(let s=0;s<step;s++)c.Iterator.moveToNext();
  c.update();
  $("targetNote").textContent=idx<targets.length?noteLabel(targets[idx].midi):"✓";
  updateProgress();
}
function colorNote(t,color){
  [t.note].concat(t.also||[]).forEach(nn=>{try{const gn=osmd.rules.GNote(nn);const g=gn&&gn.getSVGGElement&&gn.getSVGGElement();if(!g)return;
    g.querySelectorAll("path,rect,ellipse").forEach(p=>{p.setAttribute("fill",color);p.setAttribute("stroke",color);p.style.fill=color;p.style.stroke=color;});}catch(e){}});
}
function setStatus(i,s){status[i]=s;colorNote(targets[i],s==="good"?COL.good:s==="fixed"?COL.fixed:COL.bad);updateProgress();}
function updateProgress(){
  const done=status.filter(s=>s).length,good=status.filter(s=>s==="good").length;
  $("progress").textContent=targets.length?`${Math.min(idx+1,targets.length)}/${targets.length} · õigeid ${good}`:"";
}
function recolorAll(){status.forEach((s,i)=>{if(s)colorNote(targets[i],s==="good"?COL.good:s==="fixed"?COL.fixed:COL.bad);});}
window.addEventListener("resize",()=>{if(!osmd||!targets.length)return;clearTimeout(window._rt);window._rt=setTimeout(()=>{const k=idx;render();goTo(k);recolorAll();},300);});

/* ---------- controls ---------- */
$("restartBtn").addEventListener("click",()=>{stopPlay();status=targets.map(()=>null);render();goTo(0);});
$("prevBtn").addEventListener("click",()=>{stopPlay();goTo(idx-1);});
$("nextBtn").addEventListener("click",()=>{stopPlay();goTo(idx+1);});
$("giveBtn").addEventListener("click",()=>{if(idx<targets.length)tone(targets[idx].midi,0,1.2);});
$("tempo").addEventListener("input",e=>{$("tempoVal").textContent=e.target.value;});
$("sumAgain").addEventListener("click",()=>{$("summary").style.display="none";status=targets.map(()=>null);render();goTo(0);});

let playTimers=[];
function stopPlay(){playTimers.forEach(clearTimeout);playTimers=[];$("playBtn").textContent="Mängi ette";playing=false;}
let playing=false;
$("playBtn").addEventListener("click",()=>{
  if(playing){stopPlay();return;}
  if(idx>=targets.length)goTo(0);
  playing=true;$("playBtn").textContent="Stopp";
  const c=ac(),q=60/(+$("tempo").value),whole=4*q,t0=c.currentTime+0.15,start=targets[idx].ts,from=idx;
  for(let i=from;i<targets.length;i++){
    const tg=targets[i],at=(tg.ts-start)*whole;
    tone(tg.midi,t0+at,tg.len*whole*0.95);
    playTimers.push(setTimeout(()=>{if(playing){goTo(i);}},at*1000+150));
  }
  const last=targets[targets.length-1];
  playTimers.push(setTimeout(()=>{stopPlay();goTo(from);},((last.ts-start)+last.len)*whole*1000+400));
});

/* ---------- mic + following ---------- */
let stream=null,analyser=null,buf=null,running=false;
let held=0,active=false,wrongMs=0,wrongNote=null,onset=false,silentFrames=0,lastT=0;
const recent=[];
$("micBtn").addEventListener("click",async()=>{
  if(running){stopMic();return;}
  stopPlay();
  try{
    const c=ac();
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=c.createMediaStreamSource(stream);analyser=c.createAnalyser();analyser.fftSize=2048;src.connect(analyser);
    buf=new Float32Array(2048);running=true;$("micBtn").textContent="Lõpeta";$("micBtn").classList.add("on");showMsg("");
    lastT=performance.now();requestAnimationFrame(loop);
  }catch(e){showMsg("Mikrofon ei käivitunud. Luba mikrofoni kasutamine (iPhone: Seaded → Safari → Mikrofon). Leht peab olema avatud https-aadressilt.");}
});
function stopMic(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());$("micBtn").textContent="Laula";$("micBtn").classList.remove("on");setSung(null);}

function setSung(m){
  if(m===null){$("sungNote").textContent="–";$("sungNote").style.color="";$("needle").style.left="50%";return;}
  $("sungNote").textContent=noteLabel(m);
  const tg=targets[idx];
  if(tg){
    // distance to target in cents (octave-tolerant)
    let d=(m-tg.midi)*100;const oct=Math.round(d/1200);if(Math.abs(oct)===1&&Math.abs(d-oct*1200)<150)d-=oct*1200;
    const dd=Math.max(-50,Math.min(50,d));$("needle").style.left=(50+dd)+"%";
    $("sungNote").style.color=Math.abs(d)<=35?COL.good:Math.abs(d)<=100?"#E0A100":COL.bad;
  }
}
function feedback(t,color){$("feedback").textContent=t;$("feedback").style.color=color||"";}
function matchesMidi(r,target){return r===target||r===target+12||r===target-12;}

function loop(now){
  if(!running)return;
  const dt=Math.min(100,now-lastT);lastT=now;
  analyser.getFloatTimeDomainData(buf);
  const {f}=detect(buf,ctx.sampleRate);
  let m=null;
  if(f){const raw=69+12*Math.log2(f/440);recent.push(raw);if(recent.length>5)recent.shift();const s=[...recent].sort((a,b)=>a-b);m=s[s.length>>1];}
  else recent.length=0;
  if(m===null){silentFrames++;if(silentFrames>=3)onset=true;}else silentFrames=0;
  setSung(m);
  if(idx<targets.length)follow(m,dt);
  requestAnimationFrame(loop);
}
let stableNote=null,stableMs=0;
function follow(m,dt){
  const r=m===null?null:Math.round(m);
  if(r!==null&&r===stableNote)stableMs+=dt;else{stableNote=r;stableMs=0;}
  const tg=targets[idx],nx=targets[idx+1];
  if(r===null)return;
  if(!active){
    if(matchesMidi(r,tg.midi)&&stableMs>=70){
      setStatus(idx,status[idx]==="bad"?"fixed":"good");active=true;held=0;onset=false;wrongMs=0;
      feedback(status[idx]==="good"?"Õige!":"Parandatud!",COL.good);return;
    }
    if(!matchesMidi(r,tg.midi)&&stableMs>=320){
      // maybe the child already moved on: look ahead up to 2 notes
      for(let k=1;k<=2&&idx+k<targets.length;k++){
        if(matchesMidi(r,targets[idx+k].midi)){
          for(let j=idx;j<idx+k;j++)if(!status[j])setStatus(j,"bad");
          idx+=k;goToKeep();setStatus(idx,"good");active=true;held=0;onset=false;feedback("Õige!",COL.good);return;
        }
      }
      if(status[idx]!=="bad"){setStatus(idx,"bad");}
      const up=r>tg.midi?"liiga kõrge":"liiga madal";
      feedback(`Noodis on ${noteLabel(tg.midi)}, sina laulad ${noteLabel(r)} – ${up}`,COL.bad);
    }
    return;
  }
  // active: current note is being sung
  held+=dt;
  if(matchesMidi(r,tg.midi)){
    const q=60/(+$("tempo").value)*1000,durMs=tg.len*4*q;
    if(nx&&nx.midi===tg.midi&&(onset||held>Math.max(500,1.6*durMs))&&stableMs>=50){
      advance();setStatus(idx,"good");active=true;held=0;onset=false;feedback("Õige!",COL.good);
    }else if(!nx&&held>400){advance();}
    return;
  }
  if(nx&&matchesMidi(r,nx.midi)&&stableMs>=70){advance();setStatus(idx,"good");active=true;held=0;onset=false;feedback("Õige!",COL.good);return;}
  if(stableMs>=320){
    for(let k=2;k<=2&&idx+k<targets.length;k++){
      if(matchesMidi(r,targets[idx+k].midi)){
        for(let j=idx+1;j<idx+k;j++)if(!status[j])setStatus(j,"bad");
        idx+=k;goToKeep();setStatus(idx,"good");active=true;held=0;onset=false;feedback("Õige!",COL.good);return;
      }
    }
    if(nx){advance();active=false;if(status[idx]!=="bad")setStatus(idx,"bad");
      feedback(`Noodis on ${noteLabel(nx.midi)}, sina laulad ${noteLabel(r)} – ${r>nx.midi?"liiga kõrge":"liiga madal"}`,COL.bad);}
  }
}
function goToKeep(){const k=idx;const st=status;goTo(k);status=st;}
function advance(){
  if(idx+1>=targets.length){finish();return;}
  idx++;const c=osmd.cursor;const steps=targets[idx].step-targets[idx-1].step;
  for(let s=0;s<steps;s++)c.Iterator.moveToNext();c.update();
  $("targetNote").textContent=noteLabel(targets[idx].midi);updateProgress();
}
function finish(){
  idx=targets.length;active=false;stopMic();
  const good=status.filter(s=>s==="good").length,fixed=status.filter(s=>s==="fixed").length,n=targets.length;
  $("sumPct").textContent=Math.round(100*good/n)+"%";
  $("sumText").textContent=`${good} nooti ${n}-st kohe õigesti`+(fixed?`, ${fixed} parandatud`:"")+". Punased noodid on kohad, mida harjutada.";
  $("summary").style.display="flex";$("targetNote").textContent="✓";
}

/* ---------- restore last song ---------- */
const saved=load("la_xml");
if(saved){openScore(saved,+(load("la_opt")||0)).catch(()=>{});}
})();
</script>
</body>
</html>
